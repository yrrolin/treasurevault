name: Deploy TreasureVault Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/script-to-images/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.SUPABASE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Script-to-Images function
        run: supabase functions deploy script-to-images --project-ref dgcsydhgmqoqgnejlnvd
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
